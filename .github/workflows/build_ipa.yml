name: Build iOS App (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: echo "Installing dependencies..."

      - name: Build Project (Archive)
        run: |
          PROJECT_PATH="$(find . -type d -name 'RatoFileManager.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "Erro: RatoFileManager.xcodeproj não foi encontrado no repositório baixado pelo Actions."
            find . -maxdepth 4 -type d -print
            exit 1
          fi
          echo "Projeto encontrado em: $PROJECT_PATH"
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme RatoFileManager \
            -configuration Release \
            -archivePath $PWD/archives/RatoFileManager.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FILES=YES

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/archives/RatoFileManager.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RatoFileManager-IPA
          path: build/*.ipa
