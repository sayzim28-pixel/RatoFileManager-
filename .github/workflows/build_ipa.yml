name: Build iOS App (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: echo "Installing dependencies..."

      - name: Build Project (Archive)
        run: |
          PROJECT_PATH="$(find . -type d -name 'RatoFileManager.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "Erro: RatoFileManager.xcodeproj não foi encontrado no repositório baixado pelo Actions."
            find . -maxdepth 4 -type d -print
            exit 1
          fi
          echo "Projeto encontrado em: $PROJECT_PATH"
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme RatoFileManager \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/archives/RatoFileManager.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FILES=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find archives/RatoFileManager.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry RatoFileManager-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RatoFileManager-unsigned-IPA
          path: build/RatoFileManager-unsigned.ipa
