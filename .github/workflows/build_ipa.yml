name: Build iOS App (IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Project (Archive)
        run: |
          xcodebuild archive \
            -project RatoFileManager.xcodeproj \
            -scheme RatoFileManager \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/archives/RatoFileManager.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FILES=YES

      - name: Package IPA Manually (No Signing Required)
        run: |
          mkdir -p build/Payload
          cp -r $PWD/archives/RatoFileManager.xcarchive/Products/Applications/RatoFileManager.app build/Payload/
          cd build && zip -r RatoFileManager.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RatoFileManager-IPA
          path: build/RatoFileManager.ipa

      - name: Cleanup
        run: echo "Build process finished."
